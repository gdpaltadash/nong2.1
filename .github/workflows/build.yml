name: Build
on:
  workflow_dispatch:
  push:
    branches: [main]
env:
  CMAKE_POLICY_VERSION_MINIMUM: "3.5"
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: geode-sdk/build-geode-mod@main
        with:
          sdk: v1.3.10
          combine: false
      - uses: actions/upload-artifact@v4
        with:
          name: nong21
          path: build/*.geode
