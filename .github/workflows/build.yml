name: Build
on:
  workflow_dispatch:
  push:
    branches: [main]
env:
  CMAKE_POLICY_VERSION_MINIMUM: "3.5"
  GH_TOKEN: ${{ github.token }}
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # Compilador de 32 bits (GD 2.113 es de 32 bits)
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86

      - name: Instalar Geode CLI
        shell: pwsh
        run: |
          gh release download -R geode-sdk/cli -p "*win.zip" -D cli-dl
          Expand-Archive cli-dl/*.zip -DestinationPath cli
          echo "$PWD\cli" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Descargar Geode SDK v1.3.10 y binarios de 32 bits
        shell: pwsh
        run: |
          git clone --depth 1 --branch v1.3.10 https://github.com/geode-sdk/geode geode-sdk
          gh release download v1.3.10 -R geode-sdk/geode -p "*win*" -D bin-dl
          Get-ChildItem bin-dl
          Get-ChildItem bin-dl -Filter *.zip | ForEach-Object { Expand-Archive $_.FullName -DestinationPath bin-ex }
          New-Item -ItemType Directory -Force geode-sdk/bin/1.3.10 | Out-Null
          Get-ChildItem bin-ex -Recurse -File | Copy-Item -Destination geode-sdk/bin/1.3.10 -Force
          Get-ChildItem geode-sdk/bin/1.3.10
          echo "GEODE_SDK=$PWD\geode-sdk" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Configurar
        run: >
          cmake -B build -G Ninja
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl
          -DGEODE_TARGET_PLATFORM=Win32

      - name: Compilar
        run: cmake --build build --config RelWithDebInfo

      - uses: actions/upload-artifact@v4
        with:
          name: nong21
          path: build/*.geode
